<script>
// ─── Constants ──────────────────────────────────────────────────────────────
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = 900, H = 420;
const GY = H - 72; // ground y

// ─── Game state ─────────────────────────────────────────────────────────────
let STATE = 'menu';
let frame=0, dist=0, speed=5, score=0, best=0;
let coins=0, gems=0, scrolls=0, orbs=0;
let shakeX=0, shakeY=0;
let combo=0, comboTimer=0;
let cycleName='';

// Day/night cycle (in seconds of play)
let cycleT = 0; // 0-1, loops
const CYCLE_DUR = 1800; // frames per full cycle

// Collections
let particles=[], slashFx=[];
let obstacles=[], collectibles=[], enemies=[];
let bgObjs=[];   // scrolling bg decorations
let lastSpawn=0, spawnGap=90;
let lastCollSpawn=0;

// Power-ups active
const PU = { shield:0, magnet:0, speed:0, invinc:0 };

// Background layers
let bgL = [];

// ─── Ninja ──────────────────────────────────────────────────────────────────
const N = {
  x:130, y:GY, vy:0, jumps:0,
  sliding:false, slideT:0,
  dead:false, deathRot:0,
  anim:0, animT:0,
  attackT:0,
  scarf: Array.from({length:9},()=>({x:0,y:0,vx:0,vy:0})),
  get hb() {
    if (this.sliding) return {x:this.x+6,y:this.y+26,w:36,h:20};
    return {x:this.x+8,y:this.y+4,w:28,h:52};
  }
};

// ─── Input ──────────────────────────────────────────────────────────────────
const KEYS={};
let touchY0=0, touchT=0;
document.addEventListener('keydown',e=>{
  KEYS[e.code]=true;
  if(['Space','ArrowUp'].includes(e.code)){
    e.preventDefault();
    if(STATE==='menu'||STATE==='dead') startGame();
    else jump();
  }
  if(e.code==='ArrowDown'){e.preventDefault();slide();}
});
document.addEventListener('keyup',e=>{KEYS[e.code]=false;});
C.addEventListener('touchstart',e=>{
  e.preventDefault();
  touchY0=e.touches[0].clientY; touchT=Date.now();
  if(STATE==='menu'||STATE==='dead') startGame();
  else jump();
},{passive:false});
C.addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-touchY0;
  if(dy>40&&Date.now()-touchT<400) slide();
},{passive:false});
document.getElementById('menuBtn').addEventListener('click',startGame);
document.getElementById('deadBtn').addEventListener('click',startGame);

// ─── Background generation ─────────────────────────────────────────────────
function buildBg(){
  bgL=[];
  // Layer 0: far mountains
  let mts=[];
  for(let x=0;x<W*3;x+=100+rand(80))
    mts.push({x,h:80+rand(120),w:160+rand(80),snow:Math.random()>.4});
  bgL.push({scroll:0,spd:0.18,items:mts,kind:'mts'});

  // Layer 1: temple silhouettes
  let tmps=[];
  for(let x=0;x<W*3;x+=300+rand(200))
    tmps.push({x,h:100+rand(60),w:80+rand(40),tier:1+Math.floor(rand(2))});
  bgL.push({scroll:0,spd:0.35,items:tmps,kind:'tmpl'});

  // Layer 2: bamboo forest
  let bam=[];
  for(let x=0;x<W*3;x+=30+rand(20))
    bam.push({x,h:80+rand(100),w:6+rand(4),offset:rand(20)});
  bgL.push({scroll:0,spd:0.55,items:bam,kind:'bamb'});

  // Layer 3: sakura trees + lanterns
  let sak=[];
  for(let x=0;x<W*3;x+=160+rand(120))
    sak.push({x,type:Math.random()>.5?'sakura':'lantern',sz:1+rand(0.5)});
  bgL.push({scroll:0,spd:0.85,items:sak,kind:'sak'});

  // bg decoration objects (non-obstacle)
  bgObjs=[];
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function rand(n){return Math.random()*n;}
function rnd(n){return Math.floor(rand(n));}
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function rectsOverlap(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

// ─── Sky palette based on cycle ──────────────────────────────────────────────
function skyColor(t){
  // t: 0=dawn 0.25=day 0.5=dusk 0.75=night
  const stops=[
    {t:0,   top:[20,10,35],  bot:[180,80,60]},   // dawn
    {t:0.25,top:[30,60,120], bot:[120,160,200]},  // day
    {t:0.5, top:[80,20,10],  bot:[200,80,30]},    // dusk
    {t:0.75,top:[4,5,18],    bot:[12,10,28]},     // night
    {t:1,   top:[20,10,35],  bot:[180,80,60]},    // back to dawn
  ];
  let a=stops[0],b=stops[1];
  for(let i=0;i<stops.length-1;i++){
    if(t>=stops[i].t&&t<=stops[i+1].t){a=stops[i];b=stops[i+1];break;}
  }
  const f=(t-a.t)/(b.t-a.t);
  const it=c=>[
    Math.round(lerp(a[c][0],b[c][0],f)),
    Math.round(lerp(a[c][1],b[c][1],f)),
    Math.round(lerp(a[c][2],b[c][2],f)),
  ];
  return {top:it('top'),bot:it('bot')};
}

function rgbStr(c){return `rgb(${c[0]},${c[1]},${c[2]})`;}

function getCycleLabel(t){
  if(t<0.15) return 'DAWN';
  if(t<0.45) return 'DAY';
  if(t<0.65) return 'DUSK';
  return 'NIGHT';
}

// ─── Spawn helpers ────────────────────────────────────────────────────────────
const OBS_POOL=[
  'spike','dblspike','wall','lowbar',
  'rollinglog','firetrap','fallingrock',
  'enemyninja','samurai','flyingshuriken'
];

function pickObsType(){
  const d=dist;
  let pool=['spike'];
  if(d>500)  pool.push('dblspike','wall');
  if(d>1500) pool.push('lowbar','rollinglog');
  if(d>3000) pool.push('firetrap','fallingrock','enemyninja');
  if(d>6000) pool.push('samurai','flyingshuriken');
  return pool[rnd(pool.length)];
}

function spawnObs(){
  const id=pickObsType();
  let o={id,x:W+60,passed:false,frame:0,hp:1};
  switch(id){
    case 'spike':     o.w=28;o.h=34;o.y=GY; break;
    case 'dblspike':  o.w=58;o.h=34;o.y=GY; break;
    case 'wall':      o.w=20;o.h=72;o.y=GY-72+34; break;
    case 'lowbar':    o.w=90;o.h=20;o.y=GY-44; break;
    case 'rollinglog':o.w=36;o.h=36;o.y=GY-36;o.rot=0;o.vrot=0.07+rand(0.05);break;
    case 'firetrap':  o.w=38;o.h=50;o.y=GY-50;o.fphase=rand(Math.PI*2);break;
    case 'fallingrock':o.w=34;o.h=34;o.y=-40;o.vy=0;o.active=false;o.x=W+50+rand(80);break;
    case 'enemyninja':o.w=40;o.h=60;o.y=GY-60;o.anim=0;o.animT=0;o.vx=-(speed+1+rand(1));break;
    case 'samurai':   o.w=46;o.h=66;o.y=GY-66;o.anim=0;o.animT=0;o.vx=-(speed+0.5);o.hp=2;break;
    case 'flyingshuriken':o.w=24;o.h=24;o.y=GY-90-rand(60);o.rot=0;o.vrot=0.18;break;
  }
  o.hbPad=4;
  obstacles.push(o);
}

const COLL_TYPES=['coin','gem','scroll','orb','shield','magnet','speedboost','invinc'];
function spawnCollectible(){
  const types=['coin','coin','coin','gem','scroll','orb','shield','magnet','speedboost','invinc'];
  const id=types[rnd(types.length)];
  let c={id,x:W+60,passed:false,frame:0};
  // Random height: on ground or floating
  const flying=Math.random()>.45;
  c.y=flying?GY-40-rand(80):GY-22;
  c.baseY=c.y;
  c.w=22;c.h=22;
  collectibles.push(c);
}

// ─── Particles ───────────────────────────────────────────────────────────────
function addPart(x,y,count,opts={}){
  for(let i=0;i<count;i++){
    const ang=opts.angle!==undefined?opts.angle+rand(opts.spread||Math.PI*2):rand(Math.PI*2);
    const spd=opts.spd||rand(4)+1;
    particles.push({
      x:x+rand(opts.spread||10)-5,
      y:y+rand(6)-3,
      vx:Math.cos(ang)*spd+(rand(2)-1),
      vy:Math.sin(ang)*spd-(opts.up||0),
      life:1, decay:opts.decay||0.035+rand(0.025),
      r:opts.r||3+rand(4),
      color:opts.color||`hsl(${rand(30)},70%,55%)`,
      gravity:opts.gravity!==undefined?opts.gravity:0.15,
    });
  }
}

function addSlash(x,y){
  for(let i=0;i<18;i++){
    const ang=rand(Math.PI*2);
    slashFx.push({
      x,y,vx:Math.cos(ang)*(2+rand(6)),vy:Math.sin(ang)*(2+rand(6)),
      life:1,decay:0.07,len:10+rand(20),ang,
    });
  }
}

// ─── Game control ─────────────────────────────────────────────────────────────
function startGame(){
  STATE='playing';
  frame=0;dist=0;speed=5;score=0;
  coins=0;gems=0;scrolls=0;orbs=0;
  obstacles=[];collectibles=[];particles=[];slashFx=[];
  PU.shield=0;PU.magnet=0;PU.speed=0;PU.invinc=0;
  lastSpawn=60;lastCollSpawn=60;spawnGap=90;
  combo=0;comboTimer=0;shakeX=0;shakeY=0;cycleT=0;
  N.x=130;N.y=GY;N.vy=0;N.jumps=0;
  N.sliding=false;N.slideT=0;N.dead=false;N.deathRot=0;
  N.anim=0;N.animT=0;N.attackT=0;
  N.scarf.forEach(p=>{p.x=N.x+22;p.y=N.y-30;p.vx=0;p.vy=0;});
  buildBg();
  document.getElementById('menuScreen').classList.add('hide');
  document.getElementById('deadScreen').classList.add('hide');
  requestAnimationFrame(loop);
}

function jump(){
  if(N.dead||N.jumps>=2) return;
  N.vy=N.jumps===0?-15:-12.5;
  N.jumps++;
  addPart(N.x+22,N.y+10,N.jumps===2?16:10,{color:'#aaccff',r:3,up:1,decay:0.06,gravity:0.08});
}

function slide(){
  if(N.dead||N.y<GY-8) return;
  N.sliding=true;N.slideT=44;
}

function die(){
  if(N.dead||PU.invinc>0) return;
  if(PU.shield>0){PU.shield=0;return;}
  N.dead=true;
  addPart(N.x+22,N.y+30,28,{color:'#c0392b',r:5,decay:0.02,spd:6,gravity:0.2});
  addPart(N.x+22,N.y+30,14,{color:'#ffaa33',r:3,decay:0.03,spd:4,gravity:0.15});
  shakeX=14;shakeY=10;
  if(score>best) best=score;
  setTimeout(showDead,900);
  STATE='dead';
}

function showDead(){
  document.getElementById('dScore').textContent=`SCORE · ${String(Math.floor(score)).padStart(5,'0')}`;
  document.getElementById('dCoins').textContent=`COINS · ${coins}`;
  document.getElementById('dBest').textContent=`BEST · ${String(Math.floor(best)).padStart(5,'0')}`;
  document.getElementById('deadScreen').classList.remove('hide');
}

// ─── Draw Background ──────────────────────────────────────────────────────────
function drawBg(){
  const ct=cycleT;
  const sky=skyColor(ct);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,rgbStr(sky.top));
  grad.addColorStop(1,rgbStr(sky.bot));
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  // Sun / Moon
  const isNight=ct>0.65||ct<0.1;
  const isDusk=ct>0.45&&ct<=0.65;
  const isDawn=ct>=0&&ct<0.15;
  {
    let sunX,sunY,sunR,sunCol,glowCol;
    if(isNight){
      // Moon
      const phase=(ct-0.65+1)%1/0.35;
      sunX=700+Math.sin(phase*Math.PI*2)*80;
      sunY=55+Math.cos(phase*Math.PI)*30;
      sunR=28;sunCol='#e8e4d0';glowCol='#ffffff44';
      ctx.save();
      ctx.fillStyle=glowCol;
      ctx.shadowBlur=40;ctx.shadowColor='#ffffffaa';
      ctx.beginPath();ctx.arc(sunX,sunY,sunR+20,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=sunCol;
      ctx.beginPath();ctx.arc(sunX,sunY,sunR,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(150,140,120,.2)';
      ctx.beginPath();ctx.arc(sunX+8,sunY-6,10,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sunX-7,sunY+5,7,0,Math.PI*2);ctx.fill();
      ctx.restore();
      // Stars
      ctx.save();
      const starAlpha=isNight?0.9:0;
      for(let i=0;i<60;i++){
        const sx=(i*137+frame*0.005)%W;
        const sy=(i*79)%(H*0.55);
        const flicker=Math.sin(frame*0.04+i*1.3)*0.4+0.6;
        ctx.fillStyle=`rgba(220,230,255,${starAlpha*flicker*0.8})`;
        ctx.fillRect(sx,sy,i%3===0?2:1,i%3===0?2:1);
      }
      ctx.restore();
    } else {
      // Sun
      const phase=ct/0.65;
      sunX=lerp(100,800,phase);
      sunY=lerp(180,50,Math.sin(phase*Math.PI));
      sunR=isDusk||isDawn?34:28;
      sunCol=isDusk?'#ff6633':isDawn?'#ff9944':'#fff8c0';
      glowCol=isDusk?'#ff440033':isDawn?'#ff660033':'#fff8a022';
      ctx.save();
      ctx.fillStyle=glowCol;
      for(let r=80;r>0;r-=20){
        ctx.globalAlpha=(80-r)/80*0.3;
        ctx.beginPath();ctx.arc(sunX,sunY,sunR+r,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.fillStyle=sunCol;
      ctx.shadowBlur=30;ctx.shadowColor=sunCol;
      ctx.beginPath();ctx.arc(sunX,sunY,sunR,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }

  // Clouds (day only)
  if(ct>0.1&&ct<0.6){
    const ca=clamp(1-Math.abs(ct-0.35)/0.25,0,1);
    ctx.save();ctx.globalAlpha=ca*0.55;
    for(let i=0;i<6;i++){
      const cx2=((i*180+dist*0.04)%W+W)%W;
      const cy=30+i*18;
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.ellipse(cx2,cy,55+i*10,22,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(cx2+30,cy+5,30,16,0,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  // Layer 0: Mountains
  const ml=bgL[0];
  drawLayerLoop(ml,()=>{});
  for(let rep=-1;rep<=2;rep++){
    for(const m of ml.items){
      const mx=m.x+ml.scroll+rep*(W*3);
      if(mx>W+200||mx+m.w<-200) continue;
      drawMountain(mx,m.h,m.w,m.snow,ct);
    }
  }

  // Layer 1: Temples
  const tl=bgL[1];
  for(let rep=-1;rep<=2;rep++){
    for(const t of tl.items){
      const tx=t.x+tl.scroll+rep*(W*3);
      if(tx>W+100||tx+t.w<-100) continue;
      drawTemple(tx,t.h,t.w,ct);
    }
  }

  // Layer 2: Bamboo
  const bl2=bgL[2];
  for(let rep=-1;rep<=2;rep++){
    for(const b of bl2.items){
      const bx=b.x+bl2.scroll+rep*(W*3);
      if(bx>W+50||bx<-50) continue;
      drawBamboo(bx,b.h,b.w,b.offset,ct);
    }
  }

  // Ground
  const nightFactor=isNight?0.15:isDusk?0.6:1;
  const ggrad=ctx.createLinearGradient(0,GY,0,H);
  ggrad.addColorStop(0,`rgba(${isDusk?'60,30,20':isNight?'8,12,20':'30,50,20'},.95)`);
  ggrad.addColorStop(1,`rgba(${isNight?'4,6,10':'15,25,10'},.99)`);
  ctx.fillStyle=ggrad;
  ctx.fillRect(0,GY,W,H-GY);
  // Ground edge glow
  const glowC=isDusk?'200,80,20':isNight?'40,60,120':'60,120,40';
  ctx.fillStyle=`rgba(${glowC},0.25)`;ctx.fillRect(0,GY,W,3);
  ctx.fillStyle=`rgba(${glowC},0.6)`;ctx.fillRect(0,GY,W,1);
  // Ground tiles
  ctx.save();
  ctx.strokeStyle=isNight?'rgba(80,100,180,0.08)':'rgba(255,255,255,0.06)';
  ctx.lineWidth=1;
  const toff=(dist*0.5)%70;
  for(let tx=-toff;tx<W;tx+=70){
    ctx.beginPath();ctx.moveTo(tx,GY);ctx.lineTo(tx,H);ctx.stroke();
  }
  ctx.restore();

  // Layer 3: Sakura / Lanterns (in front of ground)
  const sl=bgL[3];
  for(let rep=-1;rep<=2;rep++){
    for(const s of sl.items){
      const sx=s.x+sl.scroll+rep*(W*3);
      if(sx>W+80||sx<-80) continue;
      if(s.type==='sakura') drawSakura(sx,s.sz,ct);
      else drawLantern(sx,GY-50,ct);
    }
  }
}

function drawLayerLoop(){}

function drawMountain(x,h,w,snow,ct){
  const isNight=ct>0.65||ct<0.1;
  const mc=isNight?'#0c0c1a':ct>0.45?'#251520':'#1a1830';
  ctx.save();
  ctx.fillStyle=mc;
  ctx.beginPath();
  ctx.moveTo(x,GY-10);
  ctx.lineTo(x+w*0.5,GY-10-h);
  ctx.lineTo(x+w,GY-10);
  ctx.closePath();ctx.fill();
  if(snow){
    ctx.fillStyle=isNight?'#1c1c30':ct>0.45?'#3a2535':'#28284a';
    ctx.beginPath();
    ctx.moveTo(x+w*0.5,GY-10-h);
    ctx.lineTo(x+w*0.38,GY-10-h*0.72);
    ctx.lineTo(x+w*0.62,GY-10-h*0.72);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

function drawTemple(x,h,w,ct){
  const isNight=ct>0.65||ct<0.1;
  const tc=isNight?'#090916':'#100c20';
  const rc=isNight?'#130c10':'#1e1020';
  ctx.save();
  ctx.fillStyle=tc;
  // Tiers
  const tiers=2;
  for(let t=0;t<tiers;t++){
    const tw=w*(1-t*0.25);
    const th=h/(tiers+1);
    const tx=x+(w-tw)/2;
    const ty=GY-10-th*(t+1)-t*10;
    ctx.fillRect(tx,ty,tw,th);
    // Roof
    ctx.fillStyle=rc;
    ctx.beginPath();
    ctx.moveTo(tx-10,ty);
    ctx.lineTo(tx+tw/2,ty-28);
    ctx.lineTo(tx+tw+10,ty);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=tc;
  }
  // Base
  ctx.fillStyle=tc;
  ctx.fillRect(x,GY-10-h/(tiers+1),w,12);
  // Lantern at entrance
  if(!isNight) drawLantern(x+w/2,GY-10-h/(tiers+1)-14,ct,true);
  ctx.restore();
}

function drawBamboo(x,h,w,off,ct){
  const isNight=ct>0.65||ct<0.1;
  const alpha=isNight?0.35:0.65;
  ctx.save();ctx.globalAlpha=alpha;
  const gc=isNight?'#1a2a18':'#2a4a20';
  const nc=isNight?'#0f1f0f':'#1a3015';
  ctx.strokeStyle=gc;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,GY);ctx.lineTo(x,GY-h);ctx.stroke();
  // Nodes
  ctx.strokeStyle=nc;ctx.lineWidth=w+2;
  for(let yy=GY-30;yy>GY-h;yy-=28+off){
    ctx.beginPath();ctx.moveTo(x-w,yy);ctx.lineTo(x+w,yy);ctx.stroke();
  }
  // Leaf tufts
  ctx.strokeStyle=isNight?'#1e3518':'#2d5218';
  ctx.lineWidth=2;
  for(let yy=GY-40;yy>GY-h+10;yy-=40){
    ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+18,yy-12);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x-16,yy-10);ctx.stroke();
  }
  ctx.restore();
}

function drawSakura(x,sz,ct){
  const isNight=ct>0.65||ct<0.1;
  ctx.save();
  const trunkC=isNight?'#1a0f08':'#2c1a0a';
  ctx.strokeStyle=trunkC;ctx.lineWidth=7*sz;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,GY);ctx.lineTo(x,GY-70*sz);ctx.stroke();
  // Branches
  ctx.lineWidth=3*sz;
  ctx.beginPath();ctx.moveTo(x,GY-55*sz);ctx.lineTo(x+35*sz,GY-80*sz);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,GY-55*sz);ctx.lineTo(x-30*sz,GY-78*sz);ctx.stroke();
  // Blossom clouds
  const bc=ct>0.45&&ct<0.65?'#ff7755':isNight?'#5a2040':'#ffaacc';
  ctx.fillStyle=bc;
  [[0,-95],[30,-90],[-30,-88],[15,-105],[-15,-100],
   [0,-75],[25,-72],[-22,-73]].forEach(([dx,dy])=>{
    ctx.beginPath();
    ctx.arc(x+dx*sz,GY+dy*sz,14*sz+rand(4),0,Math.PI*2);ctx.fill();
  });
  // Falling petals
  if(!isNight){
    for(let i=0;i<3;i++){
      const px=x+(Math.sin(frame*0.03+i*2.1)*20);
      const py=GY-80*sz+(frame*0.4+i*40)%100;
      ctx.fillStyle='rgba(255,180,200,0.6)';
      ctx.beginPath();ctx.ellipse(px,py,4,2.5,frame*0.05+i,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

function drawLantern(x,y,ct,small=false){
  const isNight=ct>0.65||ct<0.1;
  const s=small?.7:1;
  ctx.save();
  ctx.strokeStyle='rgba(200,180,120,0.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,y-20*s);ctx.lineTo(x,y);ctx.stroke();
  ctx.fillStyle=isNight?'#cc2200':'#dd3311';
  ctx.beginPath();ctx.roundRect?ctx.roundRect(x-9*s,y,18*s,24*s,4*s):ctx.rect(x-9*s,y,18*s,24*s);
  ctx.fill();
  ctx.fillStyle='rgba(255,120,60,0.4)';
  ctx.fillRect(x-6*s,y+3*s,12*s,16*s);
  // Top/bottom caps
  ctx.fillStyle='#8b3a00';
  ctx.fillRect(x-10*s,y-3*s,20*s,5*s);
  ctx.fillRect(x-10*s,y+24*s,20*s,5*s);
  // Glow
  const glowA=isNight?0.25:0.1;
  const glowGrad=ctx.createRadialGradient(x,y+12*s,2,x,y+12*s,40*s);
  glowGrad.addColorStop(0,`rgba(255,120,50,${glowA})`);
  glowGrad.addColorStop(1,'rgba(255,80,20,0)');
  ctx.fillStyle=glowGrad;
  ctx.beginPath();ctx.arc(x,y+12*s,40*s,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ─── Draw Obstacles ───────────────────────────────────────────────────────────
function drawObs(o){
  ctx.save();
  switch(o.id){
    case 'spike': case 'dblspike': drawSpikes(o); break;
    case 'wall':    drawWall(o); break;
    case 'lowbar':  drawLowbar(o); break;
    case 'rollinglog': drawLog(o); break;
    case 'firetrap': drawFire(o); break;
    case 'fallingrock': drawRock(o); break;
    case 'enemyninja': drawEnemyNinja(o); break;
    case 'samurai':   drawSamurai(o); break;
    case 'flyingshuriken': drawFlyingShuriken(o); break;
  }
  ctx.restore();
}

function drawSpikes(o){
  const count=o.id==='dblspike'?2:1;
  for(let c=0;c<count;c++){
    const ox=o.x+c*30;
    ctx.fillStyle='#334455';
    ctx.fillRect(ox,GY-8,28,8);
    const sg=ctx.createLinearGradient(ox,GY-o.h,ox+14,GY);
    sg.addColorStop(0,'#ccddee');sg.addColorStop(1,'#667788');
    ctx.fillStyle=sg;
    ctx.beginPath();ctx.moveTo(ox,GY);ctx.lineTo(ox+14,GY-o.h);ctx.lineTo(ox+28,GY);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.beginPath();ctx.moveTo(ox+10,GY-4);ctx.lineTo(ox+14,GY-o.h+3);ctx.lineTo(ox+17,GY-4);ctx.closePath();ctx.fill();
  }
}

function drawWall(o){
  const bH=o.h/4;
  for(let r=0;r<4;r++){
    const rc=['#2a2a3c','#333348','#3a3a50','#2d2d40'][r%4];
    ctx.fillStyle=rc;
    const offX=r%2===0?0:o.w/4;
    ctx.fillRect(o.x+offX,o.y+r*bH,o.w/2-1,bH-1);
    ctx.fillRect(o.x+offX+o.w/2,o.y+r*bH,o.w/2-1,bH-1);
  }
  ctx.strokeStyle='#1a1a28';ctx.lineWidth=1;ctx.strokeRect(o.x,o.y,o.w,o.h);
  for(let s=0;s<3;s++){
    ctx.fillStyle='#8899aa';
    ctx.beginPath();ctx.moveTo(o.x+s*8,o.y);ctx.lineTo(o.x+s*8+4,o.y-12);ctx.lineTo(o.x+s*8+8,o.y);ctx.closePath();ctx.fill();
  }
}

function drawLowbar(o){
  const by=o.y;
  ctx.fillStyle='#8b0000';ctx.fillRect(o.x,by,o.w,o.h);
  ctx.fillStyle='#aa1111';ctx.fillRect(o.x+2,by+2,o.w-4,o.h-4);
  ctx.strokeStyle='#cc3333';ctx.lineWidth=1.5;ctx.strokeRect(o.x,by,o.w,o.h);
  // Chain
  ctx.strokeStyle='#666';ctx.lineWidth=2;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(o.x+12,by);ctx.lineTo(o.x+12,by-32);ctx.stroke();
  ctx.beginPath();ctx.moveTo(o.x+o.w-12,by);ctx.lineTo(o.x+o.w-12,by-32);ctx.stroke();
  ctx.setLineDash([]);
}

function drawLog(o){
  ctx.save();
  ctx.translate(o.x+18,o.y+18);
  ctx.rotate(o.rot);
  const rg=ctx.createRadialGradient(-4,-4,2,0,0,20);
  rg.addColorStop(0,'#8b5e2a');rg.addColorStop(1,'#5c3a14');
  ctx.fillStyle=rg;
  ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#3a2008';ctx.lineWidth=2;
  for(let r=6;r<18;r+=6){
    ctx.globalAlpha=0.4;
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
  // End grain lines
  ctx.strokeStyle='#6b4522';ctx.lineWidth=1.5;
  for(let a=0;a<Math.PI;a+=Math.PI/5){
    ctx.beginPath();ctx.moveTo(Math.cos(a)*4,Math.sin(a)*4);ctx.lineTo(Math.cos(a)*17,Math.sin(a)*17);ctx.stroke();
    ctx.beginPath();ctx.moveTo(Math.cos(a+Math.PI)*4,Math.sin(a+Math.PI)*4);ctx.lineTo(Math.cos(a+Math.PI)*17,Math.sin(a+Math.PI)*17);ctx.stroke();
  }
  ctx.restore();
}

function drawFire(o){
  const ph=o.fphase+frame*0.15;
  // Base
  ctx.fillStyle='#333';ctx.fillRect(o.x,GY-8,o.w,8);
  // Logs
  ctx.fillStyle='#5c3a14';
  ctx.save();ctx.translate(o.x+o.w/2,GY-4);ctx.rotate(0.5);ctx.fillRect(-16,-4,32,8);ctx.restore();
  ctx.save();ctx.translate(o.x+o.w/2,GY-4);ctx.rotate(-0.5);ctx.fillRect(-16,-4,32,8);ctx.restore();
  // Flames - layered
  const flames=[
    {w:24,h:44,c:'#ff2200',oy:0},
    {w:18,h:38,c:'#ff5500',oy:4},
    {w:12,h:28,c:'#ff9900',oy:8},
    {w:8, h:18,c:'#ffdd00',oy:12},
  ];
  flames.forEach(f=>{
    for(let i=-1;i<=1;i++){
      const fx=o.x+o.w/2+i*6+Math.sin(ph+i)*4;
      const fy=GY-f.oy-f.h*0.5;
      const flameH=f.h*(0.8+Math.sin(ph+i*1.3)*0.2);
      ctx.fillStyle=f.c;
      ctx.globalAlpha=0.85;
      ctx.beginPath();
      ctx.moveTo(fx-f.w/2,GY-f.oy);
      ctx.quadraticCurveTo(fx-f.w/3,fy,fx,GY-f.oy-flameH);
      ctx.quadraticCurveTo(fx+f.w/3,fy,fx+f.w/2,GY-f.oy);
      ctx.closePath();ctx.fill();
    }
  });
  ctx.globalAlpha=1;
  // Embers
  for(let i=0;i<4;i++){
    const ep=((ph*0.8+i*1.6)%Math.PI*2);
    const ex=o.x+o.w/2+Math.sin(ep+i)*18;
    const ey=GY-30-((ph*20+i*25)%50);
    ctx.fillStyle='#ffaa00';ctx.globalAlpha=0.8;
    ctx.beginPath();ctx.arc(ex,ey,1.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawRock(o){
  if(!o.active&&o.x>W) return;
  const rg=ctx.createRadialGradient(o.x+10,o.y+8,4,o.x+17,o.y+17,22);

  ctx.lineTo(o.x+8,o.y+34);
  ctx.lineTo(o.x,o.y+18);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#223';ctx.lineWidth=2;ctx.stroke();

// ─── Draw Collectibles ────────────────────────────────────────────────────────
const COLL_COLORS={
  coin:'#ffcc00',gem:'#00ddff',scroll:'#ff9933',orb:'#aa44ff',
  shield:'#2288ff',magnet:'#cc44ff',speedboost:'#ffaa00',invinc:'#44ff88'
};
const COLL_LABELS={
  coin:'¥',gem:'◆',scroll:'巻',orb:'⊕',
  shield:'⛨',magnet:'⊕',speedboost:'⚡',invinc:'★'
};

function drawColl(c){
  c.frame++;
  const bob=Math.sin(c.frame*0.08)*4;
  const col=COLL_COLORS[c.id];
  const lbl=COLL_LABELS[c.id];
  const isPU=['shield','magnet','speedboost','invinc'].includes(c.id);
  ctx.save();
  const cx=c.x+11,cy=c.y+11+bob;
  // Glow
  const glowR=isPU?22:16;
  const gGrad=ctx.createRadialGradient(cx,cy,2,cx,cy,glowR);
  gGrad.addColorStop(0,col+'88');gGrad.addColorStop(1,col+'00');
  ctx.fillStyle=gGrad;ctx.beginPath();ctx.arc(cx,cy,glowR,0,Math.PI*2);ctx.fill();
  // Coin spin illusion
  if(c.id==='coin'){
    const scaleX=Math.abs(Math.cos(c.frame*0.12));
    ctx.save();ctx.translate(cx,cy);ctx.scale(scaleX,1);
    ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffee44';ctx.beginPath();ctx.arc(-2,-2,5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  } else if(c.id==='gem'){
    ctx.fillStyle=col;
    ctx.beginPath();ctx.moveTo(cx,cy-11);ctx.lineTo(cx+9,cy);ctx.lineTo(cx,cy+11);ctx.lineTo(cx-9,cy);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.beginPath();ctx.moveTo(cx,cy-11);ctx.lineTo(cx+9,cy);ctx.lineTo(cx,cy-2);ctx.closePath();ctx.fill();
  } else {
    // Box for power-ups, circle for others
    if(isPU){
      ctx.fillStyle=col+'cc';
      ctx.beginPath();ctx.roundRect?ctx.roundRect(cx-12,cy-12,24,24,5):ctx.rect(cx-12,cy-12,24,24);
      ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;ctx.stroke();
    } else {
      ctx.fillStyle=col+'cc';
      ctx.beginPath();ctx.arc(cx,cy,11,0,Math.PI*2);ctx.fill();
    }
  }
  // Label
  ctx.fillStyle='#fff';ctx.font=`bold ${isPU?11:13}px serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(lbl,cx,cy+1);
  ctx.restore();
}

function drawNinjaBody(f,attackT,inAir,dead){
  const ls=inAir?8:Math.sin(f*Math.PI/4)*22;
  const ls2=inAir?-6:Math.sin(f*Math.PI/4+Math.PI)*22;
  const as=inAir?-55:Math.sin(f*Math.PI/4+Math.PI)*32;
  const as2=inAir?30:Math.sin(f*Math.PI/4)*32;

  // Back leg
  ctx.strokeStyle='#1a0a0a';ctx.lineWidth=9;ctx.lineCap='round';
  const lb2x=Math.sin(ls2*Math.PI/180)*22;
  const lb2y=12+Math.abs(Math.cos(ls2*Math.PI/180))*24;
  ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(lb2x,lb2y);ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(lb2x,lb2y,9,5,0,0,Math.PI*2);ctx.fill();

  // Body
  ctx.fillStyle='#111';ctx.beginPath();ctx.roundRect(-13,-24,26,38,4);ctx.fill();
  // Armor plates
  ctx.fillStyle='#1a1a1a';ctx.fillRect(-11,-18,22,7);ctx.fillRect(-11,-6,22,7);
  // Red sash
  ctx.fillStyle='#c0392b';ctx.fillRect(-13,2,26,7);

  // Front leg
  ctx.strokeStyle='#222';ctx.lineWidth=10;
  const lbx=Math.sin(ls*Math.PI/180)*22;
  const lby=12+Math.abs(Math.cos(ls*Math.PI/180))*24;
  ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(lbx,lby);ctx.stroke();
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.ellipse(lbx,lby,10,5,0,0,Math.PI*2);ctx.fill();

  // Back arm
  ctx.strokeStyle='#1a0a0a';ctx.lineWidth=7;
  const ba2x=-6+Math.cos((as2-90)*Math.PI/180)*22;
  const ba2y=-18+Math.sin((as2-90)*Math.PI/180)*22;
  ctx.beginPath();ctx.moveTo(-6,-18);ctx.lineTo(ba2x,ba2y);ctx.stroke();

  // Front arm
  ctx.strokeStyle='#222';
  const bax=6+Math.cos((as-90)*Math.PI/180)*22;
  const bay=-18+Math.sin((as-90)*Math.PI/180)*22;
  ctx.beginPath();ctx.moveTo(6,-18);ctx.lineTo(bax,bay);ctx.stroke();

  // Weapon in hand
  if(attackT>0){
    ctx.save();ctx.translate(bax,bay);ctx.rotate(attackT*0.35);
    drawShuriken(0,0,9);ctx.restore();
  }

  // Head (menghadap kanan, ke arah datangnya coin/rintangan)
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,-34,15,0,Math.PI*2);ctx.fill();
  // Moncong masker mengarah ke kanan
  ctx.beginPath();ctx.moveTo(11,-38);ctx.lineTo(21,-34);ctx.lineTo(11,-28);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1a0a0a';ctx.fillRect(-13,-29,26,12);
  // Mata (satu sisi, menghadap arah lari)
  ctx.fillStyle='#c0392b';ctx.shadowBlur=10;ctx.shadowColor='#c0392b';
  ctx.fillRect(4,-38,7,4);ctx.shadowBlur=0;
  // Headband
  ctx.strokeStyle='#c0392b';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,-34,15,Math.PI+0.2,Math.PI*2-0.2);ctx.stroke();
  // Ekor ikat kepala berkibar ke kiri (belakang)
  ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-13,-38);ctx.quadraticCurveTo(-27,-37,-32,-31);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-13,-30);ctx.quadraticCurveTo(-25,-25,-29,-18);ctx.stroke();
  // Kanji on headband
  ctx.fillStyle='#fff';ctx.font='8px serif';ctx.textAlign='center';
  ctx.fillText('忍',-2,-32+0.5);
}

// ─── Scarf physics ────────────────────────────────────────────────────────────
function updateScarf(){
  const headX=N.x+22+(N.sliding?26:0);
  const headY=N.sliding?N.y+10:N.y-20;
  N.scarf[0].x=headX;N.scarf[0].y=headY;
  const windX=-(speed*(PU.speed>0?1.4:1)*0.4);
  for(let i=1;i<N.scarf.length;i++){
    const p=N.scarf[i],prev=N.scarf[i-1];
    p.vx+=(windX-p.vx*0.25)*0.1+(Math.random()-.5)*0.5;
    p.vy+=(0.25-p.vy*0.18)*0.12+(Math.random()-.5)*0.3;
    p.x+=p.vx;p.y+=p.vy;
    const dx=p.x-prev.x,dy=p.y-prev.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d>9){const r=9/d;p.x=prev.x+dx*r;p.y=prev.y+dy*r;}
  }
}
function drawScarf(){
  if(N.scarf.length<2)return;
  ctx.save();ctx.lineCap='round';
  for(let i=1;i<N.scarf.length;i++){
    const p0=N.scarf[i-1],p1=N.scarf[i];
    const t=i/N.scarf.length;
    ctx.strokeStyle=i<3?'#c0392b':`rgba(180,40,30,${1-t*0.7})`;
    ctx.lineWidth=(1-t)*6+1;
    ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();
  }
  ctx.restore();
}

// ─── Collision helpers ────────────────────────────────────────────────────────
function obsHitbox(o){
  switch(o.id){
    case 'lowbar': return {x:o.x+4,y:o.y,w:o.w-8,h:o.h};
    case 'fallingrock': return {x:o.x+4,y:o.y+4,w:o.w-8,h:o.h-8};
    case 'flyingshuriken': return {x:o.x+4,y:o.y+4,w:16,h:16};
    case 'rollinglog': return {x:o.x+4,y:o.y+4,w:o.w-8,h:o.h-8};
    default: return {x:o.x+6,y:o.y,w:o.w-12,h:o.h};
  }
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop(){
  if(STATE!=='playing') return;
  frame++;
  dist+=speed;
  score=dist/20;
  speed=5+clamp(dist/3500,0,14)+(PU.speed>0?3:0);

  // Day/night
  cycleT=(cycleT+1/CYCLE_DUR)%1;

  // Shake decay
  shakeX*=0.82;shakeY*=0.82;

  // Scroll BG
  for(const l of bgL) l.scroll=(-dist*l.spd)%(W*3);

  // ── Ninja physics ──
  if(!N.dead){
    N.y+=N.vy;
    N.vy+=0.65;
    if(N.y>=GY){
      if(N.vy>5){addPart(N.x+22,GY+4,8,{color:'#aaaaaa',r:3,gravity:0.1,decay:0.07});shakeY=3;}
      N.y=GY;N.vy=0;
      if(N.jumps>0) N.jumps=0;
      if(!N.sliding) N.anim=N.anim; // keep running
    }
    if(N.slideT>0){N.slideT--;if(N.slideT<=0){N.sliding=false;}}
    if(N.attackT>0) N.attackT--;

    // ── Spawn obstacles ──
    lastSpawn++;
    spawnGap=Math.max(44,90-dist/400);
    if(lastSpawn>spawnGap&&Math.random()<0.022){
      spawnObs();lastSpawn=0;
    }

    // ── Spawn collectibles ──
    lastCollSpawn++;
    if(lastCollSpawn>70&&Math.random()<0.028){
      spawnCollectible();lastCollSpawn=0;
    }

    // ── Update obstacles ──
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      // Move
      if(o.id==='fallingrock'){
        if(!o.active){
          // Trigger when ninja is approaching
          if(o.x<N.x+400){o.active=true;}
        }
        if(o.active){o.vy+=0.5;o.y+=o.vy;}
        if(o.y>GY+60){obstacles.splice(i,1);continue;}
      } else if(o.id==='enemyninja'||o.id==='samurai'){
        o.x+=o.vx;
      } else if(o.id==='rollinglog'){
        o.x-=speed;o.rot+=o.vrot;
      } else if(o.id==='flyingshuriken'){
        o.x-=speed+1;o.rot+=o.vrot;
      } else {
        o.x-=speed;
      }
      o.frame++;
      if(o.x+o.w<-80){obstacles.splice(i,1);continue;}

      // Pass
      if(!o.passed&&o.x+o.w<N.x){
        o.passed=true;combo++;comboTimer=90;
        score+=10*(combo>3?2:1);
        if(combo>1){N.attackT=16;addSlash(N.x+50,N.y+20);}
      }

      // Collision
      if(!o.passed||o.id==='fallingrock'||o.id==='flyingshuriken'||o.id==='enemyninja'||o.id==='samurai'){
        const oh=obsHitbox(o);
        if(rectsOverlap(N.hb,oh)){die();break;}
      }
    }

    // ── Update collectibles ──
    for(let i=collectibles.length-1;i>=0;i--){
      const c=collectibles[i];
      c.x-=speed;

      // Magnet attraction
      if(PU.magnet>0){
        const dx=(N.x+22)-c.x,dy=(N.y+28)-c.y;
        const d2=Math.sqrt(dx*dx+dy*dy);
        if(d2<130){c.x+=dx/d2*7;c.y+=dy/d2*7;}
      }

      if(c.x+c.w<-40){collectibles.splice(i,1);continue;}

      const ch={x:c.x,y:c.baseY!==undefined?c.baseY+Math.sin(c.frame*0.08)*4:c.y,w:c.w,h:c.h};
      if(rectsOverlap(N.hb,ch)){
        collectibles.splice(i,1);
        collectItem(c);
        continue;
      }
    }

    // ── Tick power-ups ──
    ['shield','magnet','speed','invinc'].forEach(k=>{if(PU[k]>0)PU[k]--;});

    // ── Combo decay ──
    if(comboTimer>0) comboTimer--;else combo=0;
  }

  // ── RENDER ──
  ctx.save();
  const sx=shakeX*(Math.random()-.5)*2;
  const sy=shakeY*(Math.random()-.5)*2;
  ctx.translate(sx,sy);

  drawBg();

  // Particles behind ninja
  drawParticles();

  // Collectibles
  for(const c of collectibles) drawColl(c);

  // Obstacles
  for(const o of obstacles) drawObs(o);

  // Ninja
  drawNinja();

  // Slash FX
  drawSlashFx();

  drawInGameUI();
  ctx.restore();

  updateHUD();
  requestAnimationFrame(loop);
}

function collectItem(c){
  const fx={color:'#ffcc00',count:8};
  switch(c.id){
    case 'coin':  coins++;score+=5;fx.color='#ffcc00';break;
    case 'gem':   gems++;score+=25;fx.color='#00ddff';break;
    case 'scroll':scrolls++;score+=50;fx.color='#ff9933';break;
    case 'orb':   orbs++;score+=15;fx.color='#aa44ff';break;
    case 'shield':PU.shield=300;fx.color='#2288ff';break;
    case 'magnet':PU.magnet=400;fx.color='#cc44ff';break;
    case 'speedboost':PU.speed=300;fx.color='#ffaa00';break;
    case 'invinc':PU.invinc=250;fx.color='#44ff88';break;
  }
  addPart(c.x+11,c.baseY||c.y,fx.count,{color:fx.color,r:4,spd:4,decay:0.06,gravity:0.1,up:1});
}

// ─── FX drawing ──────────────────────────────────────────────────────────────
function drawParticles(){
  ctx.save();
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=0.97;
    p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.restore();
}

function drawSlashFx(){
  ctx.save();
  for(let i=slashFx.length-1;i>=0;i--){
    const p=slashFx[i];
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.88;p.vy*=0.88;
    p.life-=p.decay;
    if(p.life<=0){slashFx.splice(i,1);continue;}
    ctx.globalAlpha=p.life;ctx.strokeStyle='#c0392b';ctx.lineWidth=2;
    ctx.shadowBlur=6;ctx.shadowColor='#c0392b';
    ctx.beginPath();ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x+Math.cos(p.ang)*p.len*p.life,p.y+Math.sin(p.ang)*p.len*p.life);
    ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
buildBg();
// Draw static menu background
(function menuBg(){
  cycleT=0.75; // night for menu
  drawBg();
  cycleT=0;
})();
</script>
